name: Validate Plugins

on:
  pull_request:
    paths:
      - '.github/scripts/*.ts'
      - '.github/scripts/tests/*.ts'
      - '.github/workflows/validate-plugins.yml'
      - '.claude-plugin/marketplace.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'plugins/**'
      - '**/.claude-plugin/plugin.json'
      - '**/package.json'
      - '**/SKILL.md'
      - '**/agents/*.md'
      - '**/commands/*.md'
      - '**/assets/**'

jobs:
  validate-plugin-metadata:
    name: Validate Plugin Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check generated manifests and marketplace match plugin metadata
        run: npm run validate:plugin-metadata

  validate-committed-bundles:
    name: Validate Committed Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rebuild plugin bundles
        run: npm run build

      - name: Fail when a committed bundle is stale
        run: |
          # config-ui copies are compared against each other by
          # validate-config-ui-contract instead, so they are excluded here.
          if ! git diff --exit-code -- plugins ':(exclude)*config-ui*'; then
            echo "::error::A committed artifact under plugins/*/dist no longer matches its source. Run 'npm run build' and commit the result."
            exit 1
          fi

  validate-script-tests:
    name: Validate Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Run validator tests
        run: bun test ./.github/scripts/tests

  validate-marketplace:
    name: Validate Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Validate marketplace structure
        run: bun run .github/scripts/validate-marketplace.ts

      - name: Check marketplace sorted
        run: bun run .github/scripts/check-marketplace-sorted.ts

  validate-frontmatter:
    name: Validate Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Validate frontmatter
        run: bun run .github/scripts/validate-frontmatter.ts --all

  validate-claude-layout:
    name: Validate Claude Layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd .github/scripts && bun install

      - name: Validate Claude plugin layout
        run: bun run .github/scripts/validate-claude-plugin-layout.ts

  validate-config-ui-contract:
    name: Validate Config UI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Validate plugin config forms against the UI catalog
        run: bun run .github/scripts/validate-config-ui-contract.ts

  validate-versions:
    name: Validate Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Validate version consistency
        run: bun run .github/scripts/validate-versions.ts
