name: Validate Plugins

on:
  pull_request:
    paths:
      - '.github/scripts/*.ts'
      - '.github/scripts/tests/*.ts'
      - '.github/workflows/validate-plugins.yml'
      - '.claude-plugin/marketplace.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'plugins/**'
      - '**/.claude-plugin/plugin.json'
      - '**/package.json'
      - '**/SKILL.md'
      - '**/agents/*.md'
      - '**/commands/*.md'
      - '**/assets/**'

# Two jobs, each installing its dependencies once. The steps inside them are the
# same npm scripts a developer runs locally, so CI and `npm run validate:plugins`
# cannot drift apart.
jobs:
  validate-generated:
    name: Validate Generated Files And Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check manifests, marketplace entries and versions match plugin metadata
        run: npm run validate:plugin-metadata

      - name: Rebuild plugin bundles
        run: npm run build

      - name: Fail when a committed artifact is stale
        run: |
          # Covers every committed artifact under plugins/: the CLI bundles and
          # the config-ui copies alike, all of which `npm run build` regenerates.
          # Nothing verifies a copy against ui/src otherwise, so a copy that was
          # never rebuilt after a form change would ship silently.
          if [ -n "$(git status --porcelain -- plugins)" ]; then
            git status --porcelain -- plugins
            echo "::error::A committed artifact under plugins/*/dist no longer matches its source. Run 'npm run build' and commit the result."
            exit 1
          fi

  validate-repo-checks:
    name: Validate Repo Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install validator dependencies
        run: cd .github/scripts && bun install

      - name: Run validator tests
        run: bun test ./.github/scripts/tests

      - name: Validate Claude plugin layout
        run: npm run validate:claude-layout

      - name: Validate config UI contract
        run: npm run validate:config-ui

      - name: Validate skill, command and agent frontmatter
        run: npm run validate:frontmatter

      - name: Validate marketplace
        run: npm run validate:marketplace

      - name: Scan for credential material
        run: npm run validate:no-secrets
