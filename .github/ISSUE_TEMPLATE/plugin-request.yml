name: Plugin Request
description: Request a new plugin for the Apex marketplace
title: "[Plugin Request]: "
labels: ["enhancement", "plugin-request"]
body:
  - type: input
    id: plugin-name
    attributes:
      label: Plugin name
      description: A short name for the proposed plugin.
      placeholder: e.g. slack-notifier
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this plugin do?
      placeholder: Describe the plugin's purpose and core functionality.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use this plugin in your workflow?
      placeholder: Describe a concrete scenario where this plugin would help.
    validations:
      required: true
  - type: input
    id: existing-tool
    attributes:
      label: Is this wrapping an existing tool or API?
      description: If so, link to the tool/API documentation.
      placeholder: e.g. https://api.example.com/docs
    validations:
      required: false
