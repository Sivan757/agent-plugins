name: Bug Report
description: Report a bug in an agent plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin name
      description: Which plugin is affected?
      options:
        - aliyunlog
        - augment-mcp
        - ecommerce-expert
        - mysql
        - postgresql
        - ticktick
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `bash scripts/dev.sh <plugin>`
        2. Use skill '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: false
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: e.g. 1.0.16
    validations:
      required: false
